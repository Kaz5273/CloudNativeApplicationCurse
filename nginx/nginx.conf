events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Les upstreams actifs sont definis dans active.conf
    # Ce fichier est remplace par le script de bascule sans redemarrer Nginx
    include /etc/nginx/conf.d/active.conf;

    server {
        listen 80;

        # Trafic API -> backend actif
        location /api/ {
            proxy_pass         http://active_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";
        }

        # Trafic frontend -> frontend actif
        location / {
            proxy_pass         http://active_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";

            # Support du routing Vue.js (SPA)
            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }

        location @fallback {
            proxy_pass http://active_frontend;
        }
    }
}
