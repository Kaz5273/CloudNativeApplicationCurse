name: CI Pipeline

on:
  push:
    branches:
      - develop
      - main
      - feature/**
  pull_request:
    branches:
      - develop
      - main

jobs:
  lint:
    name: Lint Frontend & Backend
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Install Backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Lint Backend
        working-directory: ./backend
        run: npm run lint

  build:
    name: Build Frontend & Backend
    runs-on: self-hosted
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install Backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Build Backend (if build script exists)
        working-directory: ./backend
        run: npm run build --if-present

  test:
    name: Run Backend Tests
    runs-on: self-hosted
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Run Backend Tests
        working-directory: ./backend
        run: npm test

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: self-hosted
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend
          args: >
            -Dsonar.organization=kaz5273
            -Dsonar.projectKey=Kaz5273_CloudNativeApplicationCurse
            -Dsonar.sources=src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

      - name: Check Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          scanMetadataReportFile: backend/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        timeout-minutes: 5

  docker:
    name: Build & Push Docker Images
    runs-on: self-hosted
    needs: [build, test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend Docker Image
        run: docker build -t backend-ci ./backend

      - name: Build Frontend Docker Image
        run: docker build -t frontend-ci ./frontend

      - name: Test Backend Container
        run: |
          docker run -d --name backend-test -p 3001:3000 backend-ci
          sleep 5
          docker ps | grep backend-test
          docker stop backend-test
          docker rm backend-test

      - name: Test Frontend Container
        run: |
          docker run -d --name frontend-test -p 8081:80 frontend-ci
          sleep 3
          docker ps | grep frontend-test
          docker stop frontend-test
          docker rm frontend-test

      - name: Tag and Push Backend Image
        run: |
          $owner = "${{ github.repository_owner }}".ToLower()
          docker tag backend-ci ghcr.io/$owner/cloudnative-backend:${{ github.sha }}
          docker tag backend-ci ghcr.io/$owner/cloudnative-backend:latest
          docker push ghcr.io/$owner/cloudnative-backend:${{ github.sha }}
          docker push ghcr.io/$owner/cloudnative-backend:latest

      - name: Tag and Push Frontend Image
        run: |
          $owner = "${{ github.repository_owner }}".ToLower()
          docker tag frontend-ci ghcr.io/$owner/cloudnative-frontend:${{ github.sha }}
          docker tag frontend-ci ghcr.io/$owner/cloudnative-frontend:latest
          docker push ghcr.io/$owner/cloudnative-frontend:${{ github.sha }}
          docker push ghcr.io/$owner/cloudnative-frontend:latest

      - name: Clean up local images
        if: always()
        run: |
          $owner = "${{ github.repository_owner }}".ToLower()
          docker rmi backend-ci -f 2>$null
          docker rmi frontend-ci -f 2>$null
          docker rmi ghcr.io/$owner/cloudnative-backend:${{ github.sha }} -f 2>$null
          docker rmi ghcr.io/$owner/cloudnative-frontend:${{ github.sha }} -f 2>$null
        continue-on-error: true

  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    needs: docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run deployment script
        run: |
          $owner = "${{ github.repository_owner }}".ToLower()
          ./scripts/deploy.ps1 -ImageTag "${{ github.sha }}" -Owner $owner

      - name: Display running containers
        if: always()
        run: docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
